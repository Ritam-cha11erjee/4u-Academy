name: Sync Social Videos

on:
  schedule:
    - cron: '0 */6 * * *' # Automatically checks every 6 hours
  workflow_dispatch:        # Lets you trigger it manually anytime

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest Videos
        run: |
          node -e '
          const fs = require("fs");
          async function sync() {
            const token = process.env.META_ACCESS_TOKEN;
            const accountId = process.env.META_ACCOUNT_ID;
            
            const url = `https://graph.facebook.com/v21.0/${accountId}/media?fields=id,permalink,media_type,timestamp&access_token=${token}`;
            const res = await fetch(url);
            const data = await res.json();
            
            if (!data.data) {
              console.error("Failed to fetch data:", data);
              process.exit(1);
            }

            const videos = data.data
              .filter(item => item.media_type === "VIDEO")
              .slice(0, 4)
              .map(v => ({ id: v.id, permalink: v.permalink }));

            fs.writeFileSync("videos.json", JSON.stringify(videos, null, 2));
          }
          sync();
          '
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCOUNT_ID: ${{ secrets.META_ACCOUNT_ID }}

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Auto-update featured videos" || exit 0
          git push
